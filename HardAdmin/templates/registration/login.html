{% extends 'HardAdmin/base.html' %}

{% block title %}Вход в систему — HardAdmin{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="text-center text-primary mb-4">Авторизация</h3>

                <form method="post">
                    {% csrf_token %}

                    <!-- Поле Логин -->
                    <div class="mb-3">
                        <label for="id_username" class="form-label">Логин</label>
                        <input type="text" name="username" id="id_username" class="form-control" placeholder="Введите логин" required>
                    </div>

                    <!-- Поле Пароль -->
                    <div class="mb-3">
                        <label for="id_password" class="form-label">Пароль</label>
                        <input type="password" name="password" id="id_password" class="form-control" placeholder="Введите пароль" required>
                    </div>

                    <!-- Блок ошибок -->
                    {% if form.errors %}
                        <div class="alert alert-danger alert-dismissible fade show" role="alert">
                            Неверный логин или пароль. Попробуйте снова.
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                    {% endif %}

                    <!-- Кнопка -->
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg">Войти</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
